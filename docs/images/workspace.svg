<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Norn workspace: a search bar above a repository map, timeline, and inspector, with a diff panel across the bottom. Every panel is synchronized to one playhead.">
  <title>Norn workspace</title>

  <!-- Window -->
  <rect x="12" y="12" width="856" height="352" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Search bar -->
  <rect x="12" y="12" width="856" height="40" rx="8" fill="#3b7dbd" fill-opacity="0.14" stroke="#3b7dbd" stroke-width="1.5"/>
  <rect x="28" y="23" width="150" height="18" rx="3" fill="#6b7280" fill-opacity="0.22"/>
  <text x="36" y="36" font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">search…</text>
  <rect x="196" y="24" width="58" height="16" rx="8" fill="#3b7dbd" fill-opacity="0.5"/>
  <text x="225" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3b7dbd">messages</text>
  <rect x="260" y="24" width="42" height="16" rx="8" fill="#6b7280" fill-opacity="0.25"/>
  <text x="281" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">edits</text>
  <rect x="308" y="24" width="66" height="16" rx="8" fill="#6b7280" fill-opacity="0.25"/>
  <text x="341" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">commands</text>
  <text x="392" y="36" font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">7 matches, 12 filtered out</text>

  <!-- Repository map -->
  <rect x="12" y="52" width="176" height="200" fill="#6b7280" fill-opacity="0.07" stroke="#6b7280" stroke-width="1"/>
  <text x="100" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6b7280">repository map</text>
  <circle cx="66" cy="118" r="15" fill="#b04a44" fill-opacity="0.55"/>
  <circle cx="126" cy="140" r="10" fill="#2f8f63" fill-opacity="0.5"/>
  <circle cx="80" cy="176" r="8" fill="#3b7dbd" fill-opacity="0.5"/>
  <circle cx="134" cy="196" r="6" fill="#6b7280" fill-opacity="0.5"/>
  <line x1="66" y1="118" x2="126" y2="140" stroke="#6b7280" stroke-width="1"/>
  <line x1="66" y1="118" x2="80" y2="176" stroke="#6b7280" stroke-width="1"/>
  <text x="100" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">sized by activity</text>
  <text x="100" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">coloured by outcome</text>

  <!-- Timeline -->
  <rect x="188" y="52" width="472" height="200" fill="none" stroke="#6b7280" stroke-width="1"/>
  <text x="424" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6b7280">timeline</text>

  <!-- Lanes -->
  <text x="198" y="98" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">agent</text>
  <line x1="188" y1="104" x2="660" y2="104" stroke="#6b7280" stroke-width="0.5" stroke-opacity="0.5"/>
  <rect x="248" y="90" width="26" height="9" rx="2" fill="#3b7dbd" fill-opacity="0.65"/>
  <rect x="356" y="90" width="34" height="9" rx="2" fill="#3b7dbd" fill-opacity="0.65"/>
  <rect x="520" y="90" width="22" height="9" rx="2" fill="#3b7dbd" fill-opacity="0.65"/>

  <text x="198" y="128" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">tools</text>
  <line x1="188" y1="134" x2="660" y2="134" stroke="#6b7280" stroke-width="0.5" stroke-opacity="0.5"/>
  <rect x="286" y="120" width="18" height="9" rx="2" fill="#6b7280" fill-opacity="0.6"/>
  <rect x="404" y="120" width="46" height="9" rx="2" fill="#6b7280" fill-opacity="0.6"/>

  <text x="198" y="158" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">edits</text>
  <line x1="188" y1="164" x2="660" y2="164" stroke="#6b7280" stroke-width="0.5" stroke-opacity="0.5"/>
  <rect x="300" y="150" width="14" height="9" rx="2" fill="#2f8f63" fill-opacity="0.65"/>
  <rect x="430" y="150" width="14" height="9" rx="2" fill="#2f8f63" fill-opacity="0.65"/>
  <rect x="556" y="150" width="14" height="9" rx="2" fill="#2f8f63" fill-opacity="0.65"/>

  <text x="198" y="188" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">commands</text>
  <line x1="188" y1="194" x2="660" y2="194" stroke="#6b7280" stroke-width="0.5" stroke-opacity="0.5"/>
  <rect x="330" y="180" width="58" height="9" rx="2" fill="#6b7280" fill-opacity="0.6"/>
  <rect x="470" y="180" width="72" height="9" rx="2" fill="#6b7280" fill-opacity="0.6"/>

  <text x="198" y="218" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">outcomes</text>
  <line x1="188" y1="224" x2="660" y2="224" stroke="#6b7280" stroke-width="0.5" stroke-opacity="0.5"/>
  <rect x="392" y="210" width="12" height="9" rx="2" fill="#2f8f63" fill-opacity="0.7"/>
  <rect x="574" y="210" width="12" height="9" rx="2" fill="#b04a44" fill-opacity="0.8"/>
  <path d="M 574 206 L 586 206" stroke="#b04a44" stroke-width="2.5"/>

  <!-- Playhead -->
  <line x1="574" y1="82" x2="574" y2="246" stroke="#b04a44" stroke-width="1.75"/>
  <path d="M 568 82 L 580 82 L 574 90 z" fill="#b04a44"/>

  <!-- Inspector -->
  <rect x="660" y="52" width="208" height="200" fill="#6b7280" fill-opacity="0.07" stroke="#6b7280" stroke-width="1"/>
  <text x="764" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6b7280">inspector</text>
  <text x="674" y="98" font-family="ui-monospace, monospace" font-size="9" fill="#b04a44">Test_Case_Result · failed</text>
  <line x1="674" y1="106" x2="854" y2="106" stroke="#6b7280" stroke-width="0.5" stroke-opacity="0.5"/>
  <text x="674" y="124" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">evidence</text>
  <text x="682" y="140" font-family="system-ui, sans-serif" font-size="9" fill="#2f8f63">explicit · the outcome</text>
  <text x="682" y="154" font-family="system-ui, sans-serif" font-size="9" fill="#3b7dbd">reconstructed · edit to parser.odin</text>
  <text x="682" y="168" font-family="system-ui, sans-serif" font-size="9" fill="#3b7dbd">reconstructed · edit to lexer.odin</text>
  <text x="682" y="182" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">inferred · read of ast.odin</text>
  <text x="674" y="206" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">candidates, never causes</text>
  <text x="674" y="226" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">every score expands into</text>
  <text x="674" y="238" font-family="system-ui, sans-serif" font-size="9" fill="#6b7280">its deterministic rules</text>

  <!-- Diff panel -->
  <rect x="12" y="252" width="856" height="112" fill="none" stroke="#6b7280" stroke-width="1"/>
  <text x="28" y="274" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6b7280">diff · file replay · command output · test details</text>
  <rect x="28" y="284" width="824" height="14" fill="#b04a44" fill-opacity="0.14"/>
  <text x="36" y="295" font-family="ui-monospace, monospace" font-size="9" fill="#b04a44">- if index &gt; len(buffer) {</text>
  <rect x="28" y="300" width="824" height="14" fill="#2f8f63" fill-opacity="0.14"/>
  <text x="36" y="311" font-family="ui-monospace, monospace" font-size="9" fill="#2f8f63">+ if index &gt;= len(buffer) {</text>
  <text x="36" y="332" font-family="ui-monospace, monospace" font-size="9" fill="#6b7280">      return 0, false</text>
  <text x="28" y="352" font-family="system-ui, sans-serif" font-size="9" font-style="italic" fill="#6b7280">reconstructed at the playhead, labelled with how much replay could verify</text>

  <!-- Caption -->
  <text x="440" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#b04a44">every panel renders the same instant — moving the playhead moves all of them</text>
  <text x="440" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">hit testing and drawing share one transform, so a click always selects what was drawn</text>
</svg>
